<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DataPulse AI</title><link rel="stylesheet" href="styles.css"></head><body><header><div><b>DataPulse AI</b><small>내 데이터 기반 분석 비서</small></div><button id="theme">◐ 테마</button></header><main><section class="hero"><p>FIRESTORE · FASTAPI · OPENAI</p><h1>데이터를 아는<br>나만의 AI 비서</h1><span>저장한 시계열 데이터의 요약을 근거로 답합니다.</span></section><section id="summary" class="cards">불러오는 중…</section><section class="chart-card"><div class="chart-heading"><div><b>기록 흐름</b><small id="chart-caption">최근 저장된 값</small></div><button id="download">CSV 내려받기</button></div><svg id="trend-chart" viewBox="0 0 720 220" role="img" aria-label="시계열 추세 그래프"></svg></section><nav><button data-tab="chat" class="active">AI 채팅</button><button data-tab="data">데이터 관리</button><button data-tab="history">대화 기록</button></nav><section id="chat" class="panel active"><div id="messages" class="messages"><article class="assistant">안녕하세요. 저장된 데이터를 분석해 드릴게요.</article></div><form id="chat-form"><input id="question" required maxlength="1000" placeholder="예: 최근 추세는 어떤가요?"><button>보내기</button></form></section><section id="data" class="panel"><form id="data-form" class="data-form"><input id="date" type="date" required><input id="value" type="number" step="0.1" required placeholder="값"><input id="memo" maxlength="300" placeholder="메모 (선택)"><button>데이터 저장</button></form><div id="data-list"></div></section><section id="history" class="panel"><div id="history-list"></div></section></main><script src="config.js"></script><script src="app.js"></script></body></html>
